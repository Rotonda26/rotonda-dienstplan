<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dienstplan · Rotonda Köln</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F3F4F5;
    --panel:#FFFFFF;
    --turq:#A2C7C7;
    --turq-deep:#7FA3A3;
    --turq-tint:#E4EEEE;
    --ink:#2B2E30;
    --ink-soft:#6B7274;
    --line:#DCE0E1;
    --danger:#B24B3E;
    --code-k-bg:#F3D2CC; --code-k-text:#8A2E22;
    --code-a-bg:#54585B; --code-a-text:#FFFFFF;
    --code-u-bg:#CFE3F2; --code-u-text:#1B4A66;
    --code-ho-bg:#FCEFAE; --code-ho-text:#7A5B00;
    --code-c-bg:#E4EEEE; --code-c-text:#2B2E30;
    --section-bg:#E7E9EA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:Calibri, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:32px 20px 72px; }
  header.top{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:16px; margin-bottom:24px;
    border-bottom:1px solid var(--line); padding-bottom:20px;
  }
  h1{ font-weight:600; font-size:32px; margin:0 0 4px; color:var(--ink); letter-spacing:-0.01em; }
  header.top p{ margin:0; color:var(--ink-soft); font-size:14.5px; }
  .week-nav{
    display:flex; align-items:center; gap:14px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:6px 6px 6px 18px;
  }
  .week-nav button{
    border:none; background:var(--turq); color:var(--ink);
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .week-nav button:hover{ background:var(--turq-deep); color:#fff; }
  .week-nav .label{ font-weight:600; font-size:14.5px; min-width:200px; text-align:center; }
  .export-btn{
    border:none; background:var(--turq); color:var(--ink);
    font-weight:600; font-size:13.5px; padding:12px 18px; border-radius:999px; cursor:pointer;
  }
  .export-btn:hover{ background:var(--turq-deep); color:#fff; }
  .legend{
    display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);
    margin:0 0 22px; padding:10px 16px; background:var(--turq-tint); border-radius:10px;
  }
  .legend b{ color:var(--ink); }
  .board{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden;
  }
  .table{ display:grid; grid-template-columns:170px repeat(5,1fr); }
  .table > *{ border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
  .table > *:nth-child(6n){ border-right:none; }
  .corner{ background:var(--turq); }
  .daycol{ background:var(--turq); color:var(--ink); padding:13px 8px; text-align:center; }
  .daycol .dow{ font-size:15.5px; display:block; font-weight:600; }
  .daycol .date{ font-size:12px; opacity:.8; display:block; margin-top:1px; }
  .section-head{
    grid-column:1 / -1; background:var(--section-bg); color:var(--ink);
    font-weight:600; font-size:15px; padding:10px 16px;
  }
  .subrow-label{
    padding:12px 14px; font-size:13px; font-weight:600; color:var(--ink-soft);
    background:#FAFBFB; display:flex; align-items:center;
  }
  .name-cell{
    padding:12px 14px; font-weight:600; font-size:14px;
    display:flex; align-items:center; background:#FAFBFB;
  }
  .cell-view.code-k{ background:var(--code-k-bg); color:var(--code-k-text); }
  .cell-view.code-a{ background:var(--code-a-bg); color:var(--code-a-text); }
  .cell-view.code-u{ background:var(--code-u-bg); color:var(--code-u-text); }
  .cell-view.code-ho{ background:var(--code-ho-bg); color:var(--code-ho-text); }
  .cell-view.code-c{ background:var(--code-c-bg); color:var(--code-c-text); }
  .cell-view.filled-time{ background:var(--turq-tint); color:var(--ink); font-weight:600; }
  .cell{ position:relative; min-height:54px; padding:6px; display:flex; align-items:stretch; justify-content:stretch; }
  .cell-view{
    width:100%; padding:8px 8px; border-radius:8px; font-size:13px; cursor:pointer;
    white-space:pre-wrap; display:flex; align-items:center; justify-content:center;
    text-align:center; line-height:1.35;
  }
  .cell-view:hover{ background:var(--turq-tint); }
  .cell-view.empty{ color:#C7CBCC; font-size:18px; font-weight:300; }
  .cell textarea, .cell input[type=text]{
    width:100%; border:1px solid var(--turq-deep); border-radius:8px;
    padding:7px 8px; font-family:Calibri, "Segoe UI", sans-serif; font-size:13px;
    background:#fff; resize:none; text-align:center;
  }
  .cell textarea{ min-height:52px; text-align:left; }
  .notes-row .cell-view{ text-align:left; justify-content:flex-start; }
  .notes-row .cell textarea{ text-align:left; min-height:70px; }
  .code-chips{
    position:absolute; top:-2px; left:50%; transform:translate(-50%,-100%);
    display:flex; gap:4px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:4px; box-shadow:0 4px 10px rgba(43,46,48,.12); z-index:5;
  }
  .code-chips button{
    border:none; background:var(--turq-tint); color:var(--ink);
    font-size:11.5px; font-weight:600; padding:5px 8px; border-radius:6px; cursor:pointer;
  }
  .code-chips button:hover{ background:var(--turq); }

  .time-edit{ display:flex; flex-direction:column; gap:6px; width:100%; }
  .time-edit .chip-row{ display:flex; gap:4px; justify-content:center; flex-wrap:wrap; }
  .time-edit .chip-row button{
    border:none; background:var(--turq-tint); color:var(--ink);
    font-size:11px; font-weight:600; padding:4px 6px; border-radius:6px; cursor:pointer;
  }
  .time-edit .chip-row button:hover{ background:var(--turq); }
  .time-edit .time-inputs{ display:flex; align-items:center; gap:4px; justify-content:center; }
  .time-edit .time-inputs input[type=time]{
    width:auto; flex:1; min-width:0; padding:6px 4px; font-size:12px;
    border:1px solid var(--turq-deep); border-radius:6px;
    font-family:Calibri, "Segoe UI", sans-serif;
  }
  .time-edit .time-inputs.single input[type=time]{ flex:none; width:100%; }
  .status{ font-size:12px; color:var(--ink-soft); margin-top:12px; min-height:16px; }
  @media (max-width: 900px){
    .table{ grid-template-columns:120px repeat(5,minmax(90px,1fr)); }
    .board{ overflow-x:auto; }
    h1{ font-size:24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Dienstplan Köln</h1>
      <p>Rotonda Business Club · Empfang, Buchungen &amp; Notizen</p>
    </div>
    <div class="week-nav">
      <button id="prevWeek" aria-label="Vorherige Woche">‹</button>
      <span class="label" id="weekLabel">KW –</span>
      <button id="nextWeek" aria-label="Nächste Woche">›</button>
    </div>
    <button id="exportBtn" class="export-btn">Als Excel herunterladen</button>
  </header>

  <div class="legend">
    <span><b>U</b> = Urlaub</span>
    <span><b>K</b> = Krank</span>
    <span><b>HO</b> = Home-Office</span>
    <span><b>A</b> = Abwesend</span>
    <span><b>C</b> = Club</span>
  </div>

  <div class="board">
    <div class="table" id="grid"></div>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
// --- Supabase-Anbindung: gemeinsame, dauerhafte Speicherung für alle ---
// Dieses Projekt ("rotonda-dienstplan") ist eigens für diese App angelegt,
// getrennt vom Urlaubstool. Der Schlüssel hier ist der öffentliche
// "anon"-Schlüssel, der für Web-Apps ohne Login gedacht ist — er erlaubt nur
// das, was die Datenbank-Regeln (Row Level Security) zulassen.
const SUPABASE_URL = 'https://ddikerkooxgpwohmruua.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkaWtlcmtvb3hncHdvaG1ydXVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzQzMzUsImV4cCI6MjEwNTkxMDMzNX0.49yPMap6uhM9AR57XXVczeQ_nF-ol-MoqwxhisxlEAY';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const EMPLOYEES = ["Jeanette","Alexandra","Stefan","Janina","Sophia","Sabine","Natalie","Tina"];
const DOW = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
const CODES = ["U","K","HO","A","C"];

let currentMonday = getMonday(new Date());
let weekData = emptyWeek();

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function isoWeekKey(monday){
  const d = new Date(monday);
  d.setHours(0,0,0,0);
  const dayNr = (d.getDay() + 6) % 7;
  const thursday = new Date(d);
  thursday.setDate(d.getDate() - dayNr + 3);
  const isoYear = thursday.getFullYear();
  const yearStart = new Date(isoYear, 0, 1);
  const yearStartDayNr = (yearStart.getDay() + 6) % 7;
  const firstThursday = new Date(isoYear, 0, 1 + ((3 - yearStartDayNr + 7) % 7));
  const week = 1 + Math.round((thursday - firstThursday) / 604800000);
  return `${isoYear}-W${String(week).padStart(2,'0')}`;
}

function fmtDate(d){
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}.${mm}`;
}

function weekLabelText(monday){
  const friday = new Date(monday); friday.setDate(friday.getDate()+4);
  const key = isoWeekKey(monday);
  const kw = key.split('-W')[1];
  return `KW ${kw} · ${fmtDate(monday)}–${fmtDate(friday)}.${friday.getFullYear()}`;
}

function setStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.style.color = isError ? 'var(--danger)' : 'var(--ink-soft)';
}

function emptyWeek(){
  return { service:{}, malzmuehle:{}, erstebuchung:{}, letztebuchung:{}, notizen:{} };
}

function getNode(obj, path){
  let node = obj;
  for(const key of path){
    if(!node[key]) node[key] = {};
    node = node[key];
  }
  return node;
}

async function loadWeek(){
  const weekKey = isoWeekKey(currentMonday);
  document.getElementById('weekLabel').textContent = weekLabelText(currentMonday);
  setStatus('Lade Woche …');
  try{
    const { data, error } = await sb
      .from('weeks')
      .select('data')
      .eq('week_key', weekKey)
      .maybeSingle();
    if(error) throw error;
    weekData = (data && data.data) ? data.data : emptyWeek();
    setStatus('');
  }catch(err){
    console.error(err);
    weekData = emptyWeek();
    setStatus('Woche konnte nicht geladen werden (' + (err.message || err) + ')', true);
  }
  renderGrid();
}

async function saveWeek(){
  const weekKey = isoWeekKey(currentMonday);
  setStatus('Speichere …');
  try{
    const { error } = await sb
      .from('weeks')
      .upsert({ week_key: weekKey, data: weekData, updated_at: new Date().toISOString() }, { onConflict: 'week_key' });
    if(error) throw error;
    setStatus('Gespeichert.');
  }catch(err){
    console.error(err);
    setStatus('Speichern fehlgeschlagen (' + (err.message || err) + ')', true);
  }
}

function el(tag, cls){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  return e;
}

function dayHeaderRow(grid){
  grid.appendChild(el('div','corner'));
  for(let i=0;i<5;i++){
    const d = new Date(currentMonday); d.setDate(d.getDate()+i);
    const head = el('div','daycol');
    head.innerHTML = `<span class="dow">${DOW[i]}</span><span class="date">${fmtDate(d)}</span>`;
    grid.appendChild(head);
  }
}

function codeClass(value){
  const v = (value || '').trim().toUpperCase();
  if(v === 'K') return 'code-k';
  if(v === 'A') return 'code-a';
  if(v === 'U') return 'code-u';
  if(v === 'HO') return 'code-ho';
  if(v === 'C') return 'code-c';
  return '';
}

function sectionHead(grid, text){
  const h = el('div','section-head');
  h.textContent = text;
  grid.appendChild(h);
}

// Es darf immer nur eine Zelle gleichzeitig im Bearbeitungsmodus sein.
let activeEdit = null;

function editableRow(grid, labelText, labelCls, path, options){
  options = options || {};
  const label = el('div', labelCls || 'name-cell');
  label.textContent = labelText;
  grid.appendChild(label);
  for(let i=0;i<5;i++){
    const cell = el('div', 'cell' + (options.notesRow ? ' notes-row' : ''));
    grid.appendChild(cell);
    renderCellView(cell, path, i, options);
  }
}

function renderCellView(cell, path, dayIndex, options){
  if(activeEdit && activeEdit.cell === cell){ activeEdit = null; }
  cell.innerHTML = '';
  const dataObj = getNode(weekData, path);
  const value = dataObj[dayIndex] || '';
  let viewCls = 'cell-view';
  if(options.isCode){
    const upper = (value||'').trim().toUpperCase();
    if(CODES.includes(upper)){
      viewCls += ' ' + codeClass(value);
    } else if(value){
      // Eine eingetragene Uhrzeit (kein Kürzel) — türkis hervorheben.
      viewCls += ' filled-time';
    } else {
      viewCls += ' empty';
    }
  } else if(options.timeOnly || options.singleTime){
    viewCls += value ? ' filled-time' : ' empty';
  } else if(!value){
    viewCls += ' empty';
  }
  const view = el('div', viewCls);
  view.textContent = value || '+';
  view.addEventListener('click', () => startEdit(cell, path, dayIndex, options));
  cell.appendChild(view);
}

function startEdit(cell, path, dayIndex, options){
  if(activeEdit && activeEdit.cell !== cell){
    activeEdit.forceCommit();
  }

  if(options.isCode){
    startEditTime(cell, path, dayIndex, options, true);
  } else if(options.timeOnly){
    startEditTime(cell, path, dayIndex, options, false);
  } else if(options.singleTime){
    startEditSingleTime(cell, path, dayIndex, options);
  } else {
    startEditText(cell, path, dayIndex, options);
  }
}

// Zeit-Bearbeitung: zwei echte Uhrzeit-Felder (Beginn/Ende).
// Ergebnis wird immer einheitlich als "HH:MM–HH:MM" gespeichert.
// showCodeChips=true zeigt zusätzlich die Kürzel-Buttons (nur bei Anwesenheit).
function startEditTime(cell, path, dayIndex, options, showCodeChips){
  cell.innerHTML = '';
  const currentObj = getNode(weekData, path);
  const rawValue = (currentObj[dayIndex] || '').trim();
  const timeMatch = rawValue.match(/^(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})$/);

  const wrap = el('div','time-edit');

  if(showCodeChips){
    const chipRow = el('div','chip-row');
    CODES.forEach(code => {
      const btn = el('button');
      btn.textContent = code;
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        commitCode(code);
      });
      chipRow.appendChild(btn);
    });
    wrap.appendChild(chipRow);
  }

  const timeRow = el('div','time-inputs');
  const startInput = el('input'); startInput.type = 'time';
  const endInput = el('input'); endInput.type = 'time';
  if(timeMatch){ startInput.value = timeMatch[1]; endInput.value = timeMatch[2]; }
  timeRow.appendChild(startInput);
  timeRow.appendChild(document.createTextNode('–'));
  timeRow.appendChild(endInput);
  wrap.appendChild(timeRow);

  cell.appendChild(wrap);
  startInput.focus();

  let committed = false;
  const node = getNode(weekData, path);

  function finish(){
    if(activeEdit && activeEdit.cell === cell){ activeEdit = null; }
    renderCellView(cell, path, dayIndex, options);
    saveWeek();
  }

  function commitCode(code){
    if(committed) return;
    committed = true;
    node[dayIndex] = code;
    finish();
  }

  function finalizeTime(force){
    if(committed) return;
    const s = startInput.value, e = endInput.value;
    if(s && e){
      committed = true;
      node[dayIndex] = `${s}–${e}`;
    } else if(!s && !e){
      committed = true;
      delete node[dayIndex];
    } else if(force){
      committed = true; // unvollständige Eingabe verwerfen, alten Wert nicht anfassen
    } else {
      return; // noch nicht fertig — z. B. erst Beginn, Ende folgt gleich
    }
    finish();
  }

  activeEdit = { cell, forceCommit: () => finalizeTime(true) };

  cell.addEventListener('focusout', () => {
    setTimeout(() => {
      if(!cell.contains(document.activeElement)) finalizeTime(false);
    }, 0);
  });
  [startInput, endInput].forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); }
      if(e.key === 'Escape'){
        committed = true;
        if(activeEdit && activeEdit.cell === cell){ activeEdit = null; }
        renderCellView(cell, path, dayIndex, options);
      }
    });
  });
}

// Zeit-Bearbeitung mit nur EINEM Uhrzeit-Feld (z. B. Erste/Letzte Buchung —
// kein Zeitraum, nur ein einzelner Zeitpunkt). Gespeichert als "HH:MM".
function startEditSingleTime(cell, path, dayIndex, options){
  cell.innerHTML = '';
  const currentObj = getNode(weekData, path);
  const rawValue = (currentObj[dayIndex] || '').trim();
  const timeMatch = rawValue.match(/^(\d{1,2}:\d{2})$/);

  const wrap = el('div','time-edit');
  const timeRow = el('div','time-inputs single');
  const timeInput = el('input'); timeInput.type = 'time';
  if(timeMatch){ timeInput.value = timeMatch[1]; }
  timeRow.appendChild(timeInput);
  wrap.appendChild(timeRow);

  cell.appendChild(wrap);
  timeInput.focus();

  let committed = false;
  const node = getNode(weekData, path);

  function finish(){
    if(activeEdit && activeEdit.cell === cell){ activeEdit = null; }
    renderCellView(cell, path, dayIndex, options);
    saveWeek();
  }

  function finalize(){
    if(committed) return;
    committed = true;
    const t = timeInput.value;
    if(t){ node[dayIndex] = t; } else { delete node[dayIndex]; }
    finish();
  }

  activeEdit = { cell, forceCommit: finalize };

  cell.addEventListener('focusout', () => {
    setTimeout(() => {
      if(!cell.contains(document.activeElement)) finalize();
    }, 0);
  });
  timeInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); timeInput.blur(); }
    if(e.key === 'Escape'){
      committed = true;
      if(activeEdit && activeEdit.cell === cell){ activeEdit = null; }
      renderCellView(cell, path, dayIndex, options);
    }
  });
}

// Notizen: einfaches Freitextfeld, unverändert.
function startEditText(cell, path, dayIndex, options){
  cell.innerHTML = '';
  const isMultiline = options.multiline;
  const currentObj = getNode(weekData, path);
  const input = el(isMultiline ? 'textarea' : 'input');
  if(!isMultiline) input.type = 'text';
  input.value = currentObj[dayIndex] || '';
  cell.appendChild(input);

  input.focus();
  if(!isMultiline) input.select();

  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    if(activeEdit && activeEdit.cell === cell){ activeEdit = null; }
    const val = input.value.trim();
    const node = getNode(weekData, path);
    if(val){ node[dayIndex] = val; } else { delete node[dayIndex]; }
    renderCellView(cell, path, dayIndex, options);
    saveWeek();
  }

  activeEdit = { cell, forceCommit: commit };

  input.addEventListener('blur', () => { commit(); });
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !isMultiline){ e.preventDefault(); input.blur(); }
    if(e.key === 'Escape'){
      committed = true;
      if(activeEdit && activeEdit.cell === cell){ activeEdit = null; }
      renderCellView(cell, path, dayIndex, options);
    }
  });
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  dayHeaderRow(grid);

  sectionHead(grid, 'Anwesenheit');
  EMPLOYEES.forEach((name) => {
    editableRow(grid, name, 'name-cell', ['service', name], { showCodes:true, isCode:true, multiline:true, notesRow:true });
  });

  sectionHead(grid, 'Malzmühle');
  editableRow(grid, '', 'subrow-label', ['malzmuehle'], { timeOnly:true });

  sectionHead(grid, 'Raumbuchungen');
  editableRow(grid, 'Erste Buchung', 'subrow-label', ['erstebuchung'], { singleTime:true });
  editableRow(grid, 'Letzte Buchung', 'subrow-label', ['letztebuchung'], { singleTime:true });

  sectionHead(grid, 'Notizen');
  editableRow(grid, 'Notiz', 'subrow-label', ['notizen'], { multiline:true, notesRow:true });
}

function pad2(n){ return String(n).padStart(2,'0'); }

function exportToExcel(){
  const rows = [];
  const sectionRowIdx = [];

  const dayHeaders = [''];
  for(let i=0;i<5;i++){
    const dt = new Date(currentMonday); dt.setDate(dt.getDate()+i);
    dayHeaders.push(`${DOW[i]} ${fmtDate(dt)}`);
  }
  rows.push(dayHeaders);

  sectionRowIdx.push(rows.length);
  rows.push(['Anwesenheit','','','','','']);
  EMPLOYEES.forEach(name => {
    const obj = getNode(weekData, ['service', name]);
    rows.push([name, obj[0]||'', obj[1]||'', obj[2]||'', obj[3]||'', obj[4]||'']);
  });

  sectionRowIdx.push(rows.length);
  rows.push(['Malzmühle','','','','','']);
  const mz = weekData.malzmuehle || {};
  rows.push(['', mz[0]||'', mz[1]||'', mz[2]||'', mz[3]||'', mz[4]||'']);

  sectionRowIdx.push(rows.length);
  rows.push(['Raumbuchungen','','','','','']);
  const eb = weekData.erstebuchung || {};
  rows.push(['Erste Buchung', eb[0]||'', eb[1]||'', eb[2]||'', eb[3]||'', eb[4]||'']);
  const lb = weekData.letztebuchung || {};
  rows.push(['Letzte Buchung', lb[0]||'', lb[1]||'', lb[2]||'', lb[3]||'', lb[4]||'']);

  sectionRowIdx.push(rows.length);
  rows.push(['Notizen','','','','','']);
  const nt = weekData.notizen || {};
  rows.push(['Notiz', nt[0]||'', nt[1]||'', nt[2]||'', nt[3]||'', nt[4]||'']);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:18},{wch:24},{wch:24},{wch:24},{wch:24},{wch:24}];
  ws['!merges'] = sectionRowIdx.map(r => ({ s:{r, c:0}, e:{r, c:5} }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dienstplan');

  const friday = new Date(currentMonday); friday.setDate(friday.getDate()+4);
  const filename = `Dienstplan_${pad2(currentMonday.getDate())}_${pad2(currentMonday.getMonth()+1)}_-${pad2(friday.getDate())}_${pad2(friday.getMonth()+1)}_${String(friday.getFullYear()).slice(-2)}.xlsx`;

  XLSX.writeFile(wb, filename);
}

document.getElementById('exportBtn').addEventListener('click', exportToExcel);
document.getElementById('prevWeek').addEventListener('click', () => {
  currentMonday.setDate(currentMonday.getDate() - 7);
  loadWeek();
});
document.getElementById('nextWeek').addEventListener('click', () => {
  currentMonday.setDate(currentMonday.getDate() + 7);
  loadWeek();
});

loadWeek();
</script>
